version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cycling_db
    environment:
      POSTGRES_USER: cyclist
      POSTGRES_PASSWORD: cycling_dev_password
      POSTGRES_DB: cycling_routes
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cycling-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cyclist -d cycling_routes']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-admin:
    image: dpage/pgadmin4:latest
    container_name: cycling_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cycling.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    networks:
      - cycling-network

networks:
  cycling-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
