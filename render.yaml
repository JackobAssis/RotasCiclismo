# =============================================================================
# Render Deployment Configuration - Cycling Routes Backend
# =============================================================================
# https://render.com/docs/yaml-spec
# =============================================================================

services:
  - type: web
    name: cycling-api
    runtime: node
    region: ohio
    plan: free
    buildCommand: cd apps/api && pnpm install && pnpm run prisma:generate && pnpm run build
    startCommand: cd apps/api && node dist/main.js
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "3000"

      - key: LOG_LEVEL
        value: warn

      - key: DATABASE_URL
        fromDatabase:
          name: cycling-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

      - key: CORS_ORIGIN
        value: https://cycling.app

      - key: STORAGE_TYPE
        value: local

      - key: UPLOAD_DIR
        value: ./uploads

databases:
  - name: cycling-db
    plan: free
    region: ohio
    databaseName: cycling_routes
    ipAllowList: []
